<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Page</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        h1 { color: #2c3e50; }
        .customer-info { margin-top: 1em; }
        label { display: block; margin-top: 0.5em; }
        input[type="text"] { padding: 0.3em; width: 200px; }
        button { margin-top: 1em; padding: 0.5em 1em; }
    </style>
</head>
<body>
    <h1>Customer Information</h1>
    <div class="customer-info">
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter customer name">

            <label for="email">Email:</label>
            <input type="text" id="email" name="email" placeholder="Enter customer email">

            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
